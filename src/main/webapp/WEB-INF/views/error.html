<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center mt-4">
        <div class="col-12 col-lg-4 col-md-6 col-sm-12">
            <img src="/resources/weather-app.png" class="img-fluid mb-3 mx-auto d-block w-50" alt="Weather App Logo">

            <h1 class="text-center mb-3">Oops!</h1>

            <div class="alert text-center mb-4" th:classappend="${errorCode == 401 || errorCode == 403} ? 'alert-warning' : (${errorCode == 404} ? 'alert-info' : 'alert-danger')">
                <div class="mb-2">
                    <i th:if="${errorCode == 401 || errorCode == 403}" class="fas fa-lock fa-2x mb-3"></i>
                    <i th:if="${errorCode == 404}" class="fas fa-map-signs fa-2x mb-3"></i>
                    <i th:if="${errorCode != 401 && errorCode != 403 && errorCode != 404}" class="fas fa-exclamation-triangle fa-2x mb-3"></i>
                </div>

                <h5 class="alert-heading mb-2" th:text="${errorCode != null} ? 'Error ' + ${errorCode} : 'Error occurred'"></h5>
                <p class="mb-0" th:text="${errorMessage != null} ? ${errorMessage} : 'Something went wrong. Please try again later.'"></p>

                <hr th:if="${errorDetails != null}">
                <p class="mb-0 text-muted small" th:if="${errorDetails != null}" th:text="${errorDetails}"></p>

                <hr>
                <p class="mb-0 text-muted small">If the problem persists, please contact support.</p>
            </div>

            <div class="d-grid gap-2">
                <a th:href="@{/login}" class="btn btn-primary w-100 mb-2">
                    <i class="fas fa-sign-in-alt me-2"></i>Return to login page
                </a>

                <a th:href="@{/}" class="btn btn-outline-secondary w-100">
                    <i class="fas fa-home me-2"></i>To the main page
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
