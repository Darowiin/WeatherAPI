<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center mt-4">
            <div class="col-12 col-lg-4 col-md-6 col-sm-12">
                <img src="/resources/weather-app.png" class="img-fluid mb-3 mx-auto d-block w-50" alt="Weather App Logo" >

                <h1 class="text-center mb-4">Sign Up</h1>

                <p class="text-center mb-4">Create your account to access the Weather App</p>

                <div class="mb-3 mt-2 alert alert-danger text-center" th:if="${error}" th:text="${error}"></div>

                <form method="post">
                    <div class="form-group mb-3">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" name="username" id="username">
                    </div>

                    <div class="form-group mb-3">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" name="password" id="password">
                    </div>

                    <div class="form-group mb-3">
                        <label for="repeatedPassword">Repeat Password</label>
                        <input type="password" class="form-control" name="repeatedPassword" id="repeatedPassword">
                    </div>

                    <button class="btn btn-primary w-100 mb-3" type="submit">Sign Up</button>
                </form>
                <div class="mx-auto text-center mt-2">
                    Already have an account? <a th:href="@{/login}">Sign in here!</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
