<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .weather-card {
            transition: transform 0.3s;
            margin-bottom: 20px;
        }
        .weather-card:hover {
            transform: translateY(-5px);
        }
        .location-header {
            position: relative;
        }
        .delete-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .search-form {
            position: relative;
            margin-bottom: 30px;
        }
        .search-form button {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
        }
        .search-form input {
            padding-right: 50px;
        }
        .welcome-container {
            text-align: center;
            padding: 60px 0;
        }
    </style>
</head>
<body>
<div class="container py-4" th:if="${username != null}">
    <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div class="d-flex align-items-center">
            <img src="/resources/weather-app.png" height="40px" alt="Weather App Logo" class="me-2">
            <h1 class="h3 mb-0">Weather App</h1>
        </div>
        <div class="d-flex align-items-center">
            <span class="me-3">Welcome, <strong th:text="${username}"></strong>!</span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-secondary" type="submit">
                    <i class="fas fa-sign-out-alt me-1"></i> Logout
                </button>
            </form>
        </div>
    </header>

    <div class="search-form">
        <form action="/search" method="post">
            <div class="input-group">
                <input type="hidden" name="username" th:value="${username}">
                <input type="text" id="cityName" name="cityName" class="form-control" placeholder="Enter location">
                <button class="btn btn-primary" type="submit">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </form>
    </div>

    <div class="row" th:if="${locations != null}">
        <div class="col-md-4 col-sm-6" th:each="index : ${#numbers.sequence(0, #arrays.length(locations)-1)}">
            <div class="card weather-card shadow-sm">
                <div class="card-body">
                    <div class="location-header">
                        <h3 class="card-title" th:text="${locations[index].getName()}"></h3>
                        <form th:action="@{/delete-location}" method="post" class="delete-button">
                            <input type="hidden" name="locationId" th:value="${locations[index].getId()}" />
                            <button class="btn btn-sm btn-outline-danger rounded-circle" type="submit">
                                <i class="fas fa-times"></i>
                            </button>
                        </form>
                    </div>

                    <div th:if="${weatherResponses != null && !#arrays.isEmpty(weatherResponses)}">
                        <div class="text-center mb-3">
                            <img th:src="'https://openweathermap.org/img/wn/' + ${weatherResponses[index].icon()} + '@2x.png'" alt="Weather icon" class="img-fluid">
                            <h2 class="display-4 mb-0" th:text="${weatherResponses[index].temp() + '°C'}"></h2>
                            <p class="text-muted" th:text="${'Feels like ' + weatherResponses[index].feelsLike() + '°C'}"></p>
                            <p class="fw-bold" th:text="${weatherResponses[index].weatherDescription()}"></p>
                        </div>

                        <div class="row text-center g-2">
                            <div class="col-6">
                                <div class="p-2 border rounded">
                                    <div class="text-primary mb-1">
                                        <i class="fas fa-tint"></i>
                                    </div>
                                    <div class="small">Humidity</div>
                                    <div class="fw-bold" th:text="${weatherResponses[index].humidity() + '%'}"></div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-2 border rounded">
                                    <div class="text-primary mb-1">
                                        <i class="fas fa-wind"></i>
                                    </div>
                                    <div class="small">Wind speed</div>
                                    <div class="fw-bold" th:text="${weatherResponses[index].windSpeed() + ' m/s'}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container welcome-container" th:if="${username == null}">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <img src="/resources/weather-app.png" class="img-fluid mb-4" width="150px" alt="Weather App Logo">
            <h1 class="display-4 mb-4">Welcome to Weather App</h1>
            <p class="lead mb-5">Stay updated with real-time weather information from around the world.</p>

            <div class="d-grid gap-2 col-md-8 mx-auto">
                <a th:href="@{/login}" class="btn btn-primary btn-lg">
                    <i class="fas fa-sign-in-alt me-2"></i> Sign In
                </a>
                <a th:href="@{/registration}" class="btn btn-outline-secondary btn-lg">
                    <i class="fas fa-user-plus me-2"></i> Create Account
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
